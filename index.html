<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>schrundeng</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f5f5f5;
    }

    header {
      background-color: #5c6b54;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      font-size: 1.25rem;
      font-weight: 600;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.8;
    }

    main {
      flex: 1;
      padding: 3rem 2rem;
      text-align: center;
      color: #333;
    }

    footer {
      background-color: #e8e8e8;
      padding: 2rem;
    }

    .footer-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .footer-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 1.5rem;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .contact-label {
      font-size: 0.875rem;
      color: #666;
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #333;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s ease;
    }

    .contact-link:hover {
      color: #5c6b54;
    }

    .contact-link svg {
      width: 18px;
      height: 18px;
    }

    .footer-note {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #888;
    }

    .footer-note svg {
      width: 14px;
      height: 14px;
    }

    .footer-bottom {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #d0d0d0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .footer-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.875rem;
    }

    .footer-nav span {
      color: #666;
    }

    .footer-nav a {
      color: #333;
      text-decoration: none;
    }

    .footer-nav a:hover {
      color: #5c6b54;
    }

    .footer-credits {
      font-size: 0.75rem;
      color: #666;
      text-align: right;
    }

    .footer-credits p {
      margin-bottom: 0.25rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 1rem;
      }

      nav {
        gap: 1rem;
      }

      .contact-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-bottom {
        flex-direction: column;
        text-align: center;
      }

      .footer-credits {
        text-align: center;
      }
    }
  </style>
</head>
